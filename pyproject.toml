[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maize"
version = "0.2.0"
description = "Maize leaf severity: healthy-only autoencoder + incremental data cleaning"
requires-python = ">=3.12"
# The only place dependencies are declared; uv.lock pins exact versions + hashes (`make lock`).
# Floors skip versions with known CVEs. opencv stays on 4.x to match training on Colab.
dependencies = ["numpy<3", "opencv-python-headless>=4.8.1.78,<5"]  # preprocess.py, shared by everything

[project.optional-dependencies]
data = ["pandas", "pillow>=10.3", "imagehash", "tqdm"]                       # maize-prepare, image cache
train = ["maize[data]", "torch>=2.6", "scipy", "matplotlib"]  # <2.6: torch.load RCE (CVE-2025-32434)
serve = ["fastapi>=0.120,<1", "uvicorn<1", "python-multipart>=0.0.18,<1", "onnxruntime<2"]  # the web app only

[dependency-groups]
dev = ["pytest", "httpx", "ruff", "pip-audit"]

[project.scripts]
maize-prepare = "maize.prepare:main"
maize-train = "maize.train:main"
maize-evaluate = "maize.evaluate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
required-version = ">=0.13"
exclude-newer = "7 days"  # never lock a release younger than a week (supply-chain cooldown)

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "C90"]  # pycodestyle, pyflakes (dead code), complexity

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]  # pytest.importorskip must run before the guarded imports
