[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maize"
version = "0.2.0"
description = "Maize leaf severity: healthy-only autoencoder + incremental data cleaning"
requires-python = ">=3.10"
dependencies = [
  "numpy", "pandas", "pillow", "imagehash", "opencv-python-headless",
  "scipy", "matplotlib", "tqdm",
]

[project.optional-dependencies]
train = ["torch"]          # on Colab torch is preinstalled: skip this extra there
dev = ["pytest"]

[project.scripts]
maize-prepare = "maize.prepare:main"
maize-train = "maize.train:main"
maize-evaluate = "maize.evaluate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
