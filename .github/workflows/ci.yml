# Every push / PR: lint, test, audit. Push to main: build the image and push it to GHCR. Render builds and deploys
# main from the Dockerfile itself; the deploy hook below only runs if the RENDER_DEPLOY_HOOK_URL secret is set.
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with: {version: "0.13.6", python-version: "3.13", enable-cache: true}
      # no torch in CI, so the model tests skip themselves
      - run: uv sync --frozen --extra data --extra serve
      - run: uv run ruff check .
      - run: uv run pytest -q
      - name: Audit the shipped dependencies for known CVEs
        run: |
          uv export --frozen --no-dev --extra serve --no-emit-project -o serve.txt
          uv run pip-audit --strict --disable-pip -r serve.txt

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: {node-version: "24"}
      - run: cd frontend && npm ci --ignore-scripts && npm audit --audit-level=high && npm run build

  deploy:
    needs: [python, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"   # registry names must be lowercase
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:latest,${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Deploy this exact image on Render
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          IMG: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
        run: |
          if [ -z "$HOOK" ]; then echo "No deploy hook set: Render deploys from the repo."; exit 0; fi
          curl -fsS -X POST "$HOOK&imgURL=$(jq -rn --arg v "$IMG" '$v|@uri')"
