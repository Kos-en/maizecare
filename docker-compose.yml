# Run the web app locally exactly as it runs in production:
#   docker compose up --build        then open http://localhost:8000
# The model files come from release/ (see `make release` in the README). They are also mounted read-only,
# so a newly released model is picked up with `docker compose restart`, without rebuilding the image.
services:
  maizecare:
    build: .
    image: maizecare
    ports:
      - "8000:8000"
    environment:
      PORT: "8000"
    volumes:
      - ./release:/app/model:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
