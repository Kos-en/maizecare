<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0f0a" />
    <meta name="description" content="Identify maize diseases from a photo, see how severe they are, and get clear next steps." />
    <title>MaizeCare</title>
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="top">
      <div class="wrap top-inner">
        <a class="brand" href="#">
          <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><path d="M7 26c0-11 6-18 19-20-1 12-8 19-19 20z" /><path class="vein" d="M7 26c4-6 9-10 14-14" /></svg>
          <span data-i18n="app.name"></span>
        </a>
        <nav class="nav" aria-label="Main">
          <a href="#analyse" data-i18n="nav.analyse"></a>
          <a href="#guide" data-i18n="nav.guide"></a>
          <a href="#about" data-i18n="nav.about"></a>
        </nav>
        <span class="badge" data-i18n="app.badge"></span>
        <div class="lang" role="group" aria-label="Language / Lugha">
          <button type="button" data-lang="en">EN</button>
          <button type="button" data-lang="sw">SW</button>
        </div>
      </div>
    </header>

    <main>
      <section class="wrap hero">
        <p class="eyebrow" data-i18n="hero.eyebrow"></p>
        <h1><span data-i18n="hero.title_1"></span> <span class="hl" data-i18n="hero.title_2"></span></h1>
        <p class="lede" data-i18n="hero.lede"></p>
        <ul class="trust">
          <li><b>3</b><span data-i18n="trust.diseases"></span></li>
          <li><b>4</b><span data-i18n="trust.levels"></span></li>
          <li><b>0</b><span data-i18n="trust.photos"></span></li>
          <li><b>EN · SW</b><span data-i18n="trust.languages"></span></li>
        </ul>
      </section>

      <section id="analyse" class="wrap layout">
        <div class="card scan">
          <div class="card-title">
            <h2 data-i18n="scan.title"></h2>
            <span class="muted small" data-i18n="scan.formats"></span>
          </div>
          <div id="frame" class="frame">
            <label id="shutter" class="shutter" for="camera">
              <span class="shutter-ring">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z" /><circle cx="12" cy="13" r="3.5" /></svg>
              </span>
              <strong data-i18n="scan.take"></strong>
              <span data-i18n="scan.drop"></span>
            </label>
            <img id="photo" alt="" hidden />
            <div class="scanline" aria-hidden="true"></div>
          </div>
          <input id="camera" type="file" accept="image/*" capture="environment" hidden />
          <input id="gallery" type="file" accept="image/*" hidden />
          <div class="actions">
            <label class="btn primary" for="camera" data-i18n="scan.camera"></label>
            <label class="btn" for="gallery" data-i18n="scan.upload"></label>
          </div>
          <ul class="tips">
            <li data-i18n="scan.tip_one"></li>
            <li data-i18n="scan.tip_light"></li>
            <li data-i18n="scan.tip_frame"></li>
          </ul>
        </div>

        <div class="out" aria-live="polite">
          <div id="v-intro" class="card placeholder">
            <div class="ph-ring" aria-hidden="true"></div>
            <h2 data-i18n="intro.title"></h2>
            <ol class="how">
              <li data-i18n="intro.step_1"></li>
              <li data-i18n="intro.step_2"></li>
              <li data-i18n="intro.step_3"></li>
            </ol>
          </div>

          <div id="v-loading" class="card" hidden>
            <div class="card-title"><h2 data-i18n="loading.title"></h2></div>
            <ol id="progress" class="progress">
              <li data-i18n="loading.prepare"></li>
              <li data-i18n="loading.identify"></li>
              <li data-i18n="loading.grade"></li>
            </ol>
            <p id="wake" class="small muted" data-i18n="loading.wake" hidden></p>
          </div>

          <div id="v-error" class="card error" role="alert" hidden>
            <div class="card-title"><h2 data-i18n="error.title"></h2></div>
            <p id="error-text" class="muted"></p>
            <button id="retry" class="btn primary" type="button" data-i18n="error.retry"></button>
          </div>

          <div id="v-unsure" class="card unsure" hidden>
            <div class="card-title"><h2 data-i18n="unsure.title"></h2></div>
            <p class="muted" data-i18n="unsure.body"></p>
            <label class="btn primary" for="camera" data-i18n="unsure.retake"></label>
          </div>

          <div id="v-result" class="result" hidden>
            <article class="card verdict">
              <div class="verdict-top">
                <div class="ring">
                  <svg viewBox="0 0 120 120" aria-hidden="true">
                    <circle class="ring-track" cx="60" cy="60" r="52" pathLength="100" />
                    <circle id="ring" class="ring-fill" cx="60" cy="60" r="52" pathLength="100" />
                  </svg>
                  <div class="ring-label"><span id="pct">0</span><small>% <span data-i18n="result.damage"></span></small></div>
                </div>
                <div class="verdict-text">
                  <span id="chip" class="chip"></span>
                  <h2 id="headline" class="headline"></h2>
                  <p id="confidence" class="confidence"></p>
                  <p id="meaning" class="muted"></p>
                </div>
              </div>
              <div id="scale" class="scale"></div>
            </article>

            <article class="card">
              <div class="card-title">
                <h2 data-i18n="result.steps"></h2>
                <span id="action" class="pill"></span>
              </div>
              <ol id="steps" class="steps"></ol>
            </article>

            <a id="learn" class="card link-card" href="#guide">
              <span>
                <strong id="learn-title"></strong>
                <span id="learn-hint" class="muted small"></span>
              </span>
              <span class="arrow" aria-hidden="true">→</span>
            </a>

            <div class="dock">
              <button id="share" class="btn" type="button" data-i18n="result.share"></button>
              <button id="again" class="btn primary" type="button" data-i18n="result.again"></button>
            </div>
            <p id="model" class="note"></p>
          </div>
        </div>
      </section>

      <section id="guide" class="wrap section">
        <div class="section-head">
          <p class="eyebrow" data-i18n="guide.eyebrow"></p>
          <h2 data-i18n="guide.title"></h2>
          <p class="muted" data-i18n="guide.lede"></p>
        </div>
        <div class="card">
          <div id="tabs" class="tabs" role="group"></div>
          <div id="disease" class="disease"></div>
        </div>
      </section>

      <section id="about" class="wrap section">
        <div class="section-head">
          <p class="eyebrow" data-i18n="about.eyebrow"></p>
          <h2 data-i18n="about.title"></h2>
        </div>
        <div class="about">
          <div class="card"><h3 data-i18n="about.model_title"></h3><p class="muted" data-i18n="about.model_body"></p></div>
          <div class="card"><h3 data-i18n="about.privacy_title"></h3><p class="muted" data-i18n="about.privacy_body"></p></div>
          <div class="card"><h3 data-i18n="about.advice_title"></h3><p class="muted" data-i18n="about.advice_body"></p></div>
        </div>
      </section>
    </main>

    <footer class="foot">
      <div class="wrap foot-inner">
        <span data-i18n="footer.rights"></span>
        <span data-i18n="footer.disclaimer"></span>
      </div>
    </footer>
    <script type="module" src="main.js"></script>
  </body>
</html>
